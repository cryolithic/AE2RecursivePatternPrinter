plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'dev.cryolithic.rpp'
version = '0.1.0'

java {
    // Explicit toolchain: `java` on PATH is SDKMAN 25; NeoForge's
    // transformers expect a real 21 toolchain (DESIGN.md §3.4).
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }
}

dependencies {
    // Applied Energistics 2 19.2.17 (DESIGN.md §3.5).
    // Primary: Modrinth maven. Fallback (if Modrinth is down):
    //   implementation "curse.maven:applied-energistics-2-223794:7027323"
    implementation "maven.modrinth:ae2:${project.ae2_version}"

    // AE2 19.2.17 hard-requires GuideME at runtime.
    runtimeOnly "maven.modrinth:guideme:21.1.1"

    // ATM10 coexistence load test (DESIGN.md §3.2 / §13.2). Enabled with
    // -Patm10 so the normal dev environment stays light. ModDev loads
    // external jars from the run's runtime classpath when they are mods
    // (neoforge.mods.toml present). The jars live in the PrismLauncher
    // instance; the paths are absolute because the mod set is machine-local
    // test data, not a build input.
    if (project.hasProperty('atm10')) {
        // NOTE: the local is named atm10Dir, not atm10 — a local named
        // `atm10` is shadowed by the -Patm10 property (empty string) inside
        // the closure's GString, which silently produced bare filenames.
        def atm10Dir = '/home/james/.local/share/PrismLauncher/instances/All the Mods 10 - ATM10/minecraft/mods'
        ['AdvancedAE-1.6.7-1.21.1.jar',
         'ae2wtlib-19.3.0.jar',
         'ExtendedAE-1.21-2.2.25-neoforge.jar',
         'megacells-4.10.1.jar',
         'ae2importexportcard-1.21.1-1.4.1.jar',
         'ae2jeiintegration-1.2.0.jar',
         'AE2NetworkAnalyzer-1.21-2.1.3-neoforge.jar',
         'craftingtweaks-neoforge-1.21.1-21.1.6.jar',
         // libraries those mods hard-require (all present in the instance)
         'geckolib-neoforge-1.21.1-4.8.2.jar',
         'Glodium-1.21-2.2-neoforge.jar',
         'balm-neoforge-1.21.1-21.0.55.jar',
         'jei-1.21.1-neoforge-19.25.1.332.jar'].each {
            runtimeOnly files("${atm10Dir}/${it}")
        }
    }

    // JEI is a compile-time optional dependency only (DESIGN.md §6.5).
    compileOnly "maven.modrinth:jei:${project.jei_version}"

    // Unit tests (DESIGN.md §13.1): plain JUnit 5, no Minecraft runtime.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The ModDev plugin puts the merged+mapped Minecraft/NeoForge classes and
    // the vanilla library jars (mojmap serialization, guava, ...) on the main
    // compile classpath, which testImplementation does not inherit. Mirror the
    // resolved file list here; the paths are stable and the artifact exists by
    // the time compileTestJava runs (createMinecraftArtifacts runs first).
    testImplementation files(sourceSets.main.compileClasspath.files)
}

test {
    useJUnitPlatform()
    // Tests must run without a Minecraft bootstrap; fail fast if a test
    // accidentally pulls one in.
    systemProperty 'rpp.test.no-minecraft', 'true'
}
